<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المرجعية الإسلامية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c5e50">
</head>
<body>

<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <h3>إعادة ضبط العدادات</h3>
        <p>هل أنت متأكد من تصفير أذكار هذا القسم؟</p>
        <div class="modal-btns">
            <button class="confirm-ok" onclick="executeReset()">تصفير الآن</button>
            <button class="confirm-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<div id="home-view" class="main-menu">
    <div class="menu-header">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
            <button id="theme-btn" onclick="toggleTheme()" style="background:none; border:none; font-size: 26px; cursor: pointer;">🌙</button>
            <h1 style="margin:0; color: var(--primary-color); font-size: 24px;">المرجعية الإسلامية</h1>
            <div style="width:30px;"></div> 
        </div>
        <p style="color: #636e72; margin-top: 5px;">دليلك الشرعي وحصنك اليومي</p>
    </div>
    
    <button class="menu-card" onclick="openSection('morning')">🌅 أذكار الصباح</button>
    <button class="menu-card" onclick="openSection('evening')">🌆 أذكار المساء</button>
    <button class="menu-card" onclick="openSection('sleep')">🌙 أذكار النوم</button>
    <button class="menu-card" onclick="openSection('wake')">☀️ أذكار الاستيقاظ</button>
    
    <button class="menu-card btn-prayer" onclick="getPrayerTimes()">🕌 مواقيت الصلاة</button>
    <button class="menu-card btn-qibla" onclick="getQibla()">🧭 اتجاه القبلة</button>
    <button class="menu-card btn-library" style="grid-column: span 2;" onclick="openLibrary()">📚 المكتبة الإسلامية الشاملة</button>
    
    <button class="menu-card" style="background: #34495e; grid-column: span 2;" onclick="shareApp()">📤 مشاركة التطبيق</button>
</div>

<div id="section-view" class="view-container">
    <div class="header-nav">
        <button class="nav-btn" onclick="goHome()">🏠 القائمة</button>
        <h3 id="section-title" style="margin:0; font-size: 18px;"></h3>
        <button id="reset-nav-btn" class="nav-btn reset-btn" onclick="showResetModal()">🔄 تصفير</button>
    </div>
    <div id="azkar-list"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>

<script>
// كود تشغيل الوضع الليلي وتحديث PWA
function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-btn').innerText = '☀️';
}
</script>

</body>
</html>
