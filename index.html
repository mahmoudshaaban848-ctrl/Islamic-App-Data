<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المرجعية الإسلامية</title>

    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1B5E20">
</head>

<body>

    <!-- ================================
         الصفحة الرئيسية
    ================================= -->
    <div id="home-view">

        <div class="app-title">المرجعية الإسلامية</div>

        <div id="daily-tip"></div>

        <button class="menu-button" onclick="openSection('morning')">
            أذكار الصباح
        </button>

        <button class="menu-button" onclick="openSection('evening')">
            أذكار المساء
        </button>

        <button class="menu-button" onclick="openSection('sleep')">
            أذكار النوم
        </button>

        <button class="menu-button" onclick="openSection('wake')">
            أذكار الاستيقاظ
        </button>

        <button class="menu-button" onclick="openSection('after_prayer')">
            أذكار بعد الصلاة
        </button>

        <button class="menu-button" onclick="shareApp()">
            مشاركة التطبيق
        </button>

    </div>


    <!-- ================================
         صفحة عرض الأذكار
    ================================= -->
    <div id="section-view">

        <div class="top-buttons">
            <button onclick="goHome()">⬅ الرئيسية</button>
            <button id="reset-nav-btn" onclick="showResetModal()" style="display:none;">
                إعادة التصفير
            </button>
        </div>

        <h2 id="section-title"></h2>

        <div id="azkar-list"></div>

    </div>


    <!-- ================================
         نافذة تأكيد إعادة التصفير
    ================================= -->
    <div id="confirmModal">
        <div class="modal-content">
            <p>هل تريد إعادة تصفير العدادات؟</p>
            <button class="confirm" onclick="executeReset()">نعم</button>
            <button class="cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>


    <!-- ================================
         JS Files
    ================================= -->
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
