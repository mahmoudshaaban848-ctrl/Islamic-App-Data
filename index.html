<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المرجعية الإسلامية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>

<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <h3>تنبيه</h3>
        <p>هل تريد إعادة تصفير جميع العدادات في هذا القسم؟</p>
        <div class="modal-btns">
            <button class="confirm-ok" onclick="executeReset()">تصفير</button>
            <button class="confirm-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<div id="home-view" class="main-menu">
    <div class="menu-header">
        <h1 style="margin:0;">المرجعية الإسلامية</h1>
        <p style="color: #636e72;">حِصنك اليومي من الأذكار</p>
    </div>
    <button class="menu-card btn-morning" onclick="openSection('morning')">أذكار الصباح</button>
    <button class="menu-card btn-evening" onclick="openSection('evening')">أذكار المساء</button>
    <button class="menu-card btn-sleep" onclick="openSection('sleep')">أذكار النوم</button>
    <button class="menu-card btn-wake" onclick="openSection('wake')">أذكار الاستيقاظ</button>
    <button class="menu-card btn-prayer" onclick="openSection('prayer')">أذكار بعد الصلاة</button>
    <button class="menu-card" style="background: #34495e; grid-column: span 2; padding: 20px;" onclick="shareApp()">📤 مشاركة التطبيق</button>
</div>

<div id="section-view" class="view-container">
    <div class="header-nav">
        <button class="nav-btn" onclick="goHome()">🏠 القائمة</button>
        <h3 id="section-title" style="margin:0;"></h3>
        <button class="nav-btn reset-btn" onclick="showResetModal()">🔄 تصفير</button>
    </div>
    <div id="azkar-list"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
    // تفعيل العمل بدون إنترن
let newWorker;
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            // كود مراقبة التحديثات
            reg.addEventListener('updatefound', () => {
                newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        // تظهر هذه الرسالة بمجرد تغييرك لـ v2 إلى v3 في ملف sw.js
                        if (confirm("يوجد تحديث جديد للأذكار، هل تريد التحميل الآن؟")) {
                            window.location.reload();
                        }
                    }
                });
            });
        });
    });
}

</script>
</body>
</html>
